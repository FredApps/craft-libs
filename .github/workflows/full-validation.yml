name: Palette typed errors exploratory check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: palette-errors-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cms:
    if: github.repository == 'FredApps/craft-libs' && github.ref == 'refs/heads/diagnostic/palette-errors'
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@2c06746765d368723dc28ac3a44b04f841bec4da
    with:
      os: '["ubuntu-24.04"]'
      select-os: '[]'
      timeout-minutes: 25
      gate-timeout-minutes: 20
      toolchain: '1.95'
      targets: ''
      tools: ''
      craft-fonts-ref: ''
      require-craft-fonts: false
      free-disk-space: false
      cache-name: palette-errors-exploratory
      command: bash scripts/palette-errors-diagnostic.sh
