name: Windows target-kind archive diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-target-kind-${{ github.ref }}
  cancel-in-progress: false
jobs:
  archive:
    name: ${{ matrix.features }} ${{ matrix.kind }}
    strategy:
      fail-fast: false
      matrix:
        features: [default, all-features]
        kind: [unit, integration]
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@7d4597abb21f0a8fa959395b0789e79fa19849ca
    with:
      os: '["windows-latest"]'
      select-os: '[]'
      timeout-minutes: 25
      tools: cargo-nextest@0.9.150
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      windows-env: |
        CARGO_PROFILE_DEV_DEBUG=0
        CRAFT_PRINT_REQUIRE_QUEUE=1
      setup-command: bash scripts/ci-test-inputs.sh
      command: bash scripts/ci-windows-target-kind.sh ${{ matrix.features }} ${{ matrix.kind }}
      artifact-name: kind-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.features }}-${{ matrix.kind }}
      artifact-path: pilot-bundle