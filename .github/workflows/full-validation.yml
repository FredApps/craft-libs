name: HPGL byte writer exploratory check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hpgl-2359-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plotter:
    if: github.repository == 'FredApps/craft-libs' && github.ref == 'refs/heads/diagnostic/hpgl2-2359'
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@2c06746765d368723dc28ac3a44b04f841bec4da
    with:
      os: '["ubuntu-24.04"]'
      select-os: '[]'
      timeout-minutes: 10
      gate-timeout-minutes: 8
      toolchain: '1.95'
      targets: ''
      tools: ''
      craft-fonts-ref: ''
      require-craft-fonts: false
      free-disk-space: false
      cache-name: hpgl-2359-exploratory
      command: bash scripts/hpgl2-diagnostic.sh
