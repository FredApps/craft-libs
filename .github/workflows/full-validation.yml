name: Windows archive timing pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-archive-pilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  archive:
    # Registration only: diagnostic scripts live on the explicitly reviewed branch.
    if: github.ref == 'refs/heads/ci/windows-archive-pilot-778'
    name: Archive ${{ matrix.features }}
    strategy:
      fail-fast: false
      matrix:
        features: [default, all-features]
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      os: '["windows-latest"]'
      select-os: '[]'
      timeout-minutes: 30
      tools: cargo-nextest@0.9.150
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      windows-env: |
        CARGO_PROFILE_DEV_DEBUG=0
        CRAFT_PRINT_REQUIRE_QUEUE=1
      setup-command: bash scripts/ci-test-inputs.sh
      command: bash scripts/ci-windows-archive-pilot.sh ${{ matrix.features }}
