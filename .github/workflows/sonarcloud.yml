name: PSD encoded-row scoped validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: psd-rows-9a594b62-${{ github.ref }}
  cancel-in-progress: false
jobs:
  psd:
    if: github.repository == 'FredApps/craft-libs' && github.ref == 'refs/heads/diag/psd-rows-9a594b62'
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@ecb64b2acb8731f0e2eb8f55fd2f45424bef75d0
    with:
      os: '["ubuntu-24.04", "windows-latest"]'
      select-os: '[]'
      timeout-minutes: 10
      gate-timeout-minutes: 8
      tools: ''
      targets: ''
      craft-fonts-ref: ''
      require-craft-fonts: false
      cache-name: psd-encoded-rows-scoped
      command: |
        git fetch --no-tags origin 9a594b621e7e1ae196cee134ac22abe11a78d839
        git diff --exit-code 9a594b621e7e1ae196cee134ac22abe11a78d839 HEAD -- . ':(exclude).github/workflows/sonarcloud.yml'
        echo 'Scoped craft-psd default/serde tests and lint only. Not corpus, full workspace or consumer certification.'
        cargo fmt -p craft-psd -- --check
        cargo test --locked -p craft-psd
        cargo test --locked -p craft-psd --features serde
        cargo clippy --locked -p craft-psd --all-targets --features serde -- -D warnings
