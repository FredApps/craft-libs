# Inactive candidate. Review before installing on a diagnostic-only branch.
# Runtime-only pilot: not full coverage, graph equivalence or a proven 30m gate.
name: Windows integrated target-kind runtime diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-integrated-pilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  archive_default_unit:
    name: Archive default unit
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@7d4597abb21f0a8fa959395b0789e79fa19849ca
    with:
      os: '["windows-latest"]'
      select-os: '[]'
      timeout-minutes: 25
      tools: cargo-nextest@0.9.150
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      windows-env: |
        CARGO_PROFILE_DEV_DEBUG=0
        CRAFT_PRINT_REQUIRE_QUEUE=1
      setup-command: bash scripts/ci-test-inputs.sh
      command: bash scripts/ci-windows-integrated-producer.sh default unit
      artifact-name: archive-${{ github.run_id }}-${{ github.run_attempt }}-default-unit
      artifact-path: pilot-bundle
  execute_default_unit:
    needs: archive_default_unit
    name: Run default unit ${{ matrix.shard }}/8
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      CRAFT_PRINT_REQUIRE_QUEUE: 1
      CRAFT_FONTS_REQUIRED: 1
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@41d7adf6c0ff7f98b2d12290fd6dc4a5d9111440
      - uses: step-security/taiki-e-install-action@v2.87.32
        with:
          tool: cargo-nextest@0.9.150
      - name: Install matching Rust runtime
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/download-artifact@v8.0.2
        with:
          name: archive-${{ github.run_id }}-${{ github.run_attempt }}-default-unit-windows-latest
          path: pilot-bundle
      - name: Verify and execute archive shard
        shell: bash
        env:
          CONFIG: default
          TARGET_KIND: unit
          SHARD: ${{ matrix.shard }}
        run: bash scripts/ci-windows-archive-consumer.sh "$CONFIG" "$SHARD" "$TARGET_KIND"
      - name: Upload successful inventory proof
        uses: actions/upload-artifact@v7.0.2
        with:
          name: proof-default-unit-${{ matrix.shard }}
          path: pilot-proof
          if-no-files-found: error
          retention-days: 1
  archive_default_integration:
    name: Archive default integration
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@7d4597abb21f0a8fa959395b0789e79fa19849ca
    with:
