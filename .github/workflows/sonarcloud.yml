name: PSD alpha-name scoped three-platform validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: psd-alpha-7798dad7-${{ github.ref }}
  cancel-in-progress: false
jobs:
  psd:
    if: github.repository == 'FredApps/craft-libs' && github.ref == 'refs/heads/diag/psd-alpha-7798dad7'
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@ecb64b2acb8731f0e2eb8f55fd2f45424bef75d0
    with:
      os: '["ubuntu-24.04", "windows-latest", "macos-latest"]'
      select-os: '[]'
      timeout-minutes: 20
      gate-timeout-minutes: 18
      tools: ''
      targets: ''
      craft-fonts-ref: ''
      require-craft-fonts: false
      cache-name: psd-alpha-scoped
      command: |
        git fetch --no-tags origin 7798dad7fbc89375ed533184febbd3e22facc82f
        git diff --exit-code 7798dad7fbc89375ed533184febbd3e22facc82f HEAD -- . ':(exclude).github/workflows/sonarcloud.yml'
        echo 'Scoped craft-psd default and serde tests/doctests and strict lint; not corpus/all-features/workspace or consumer certification.'
        cargo fmt -p craft-psd -- --check
        cargo test --locked -p craft-psd
        cargo test --locked -p craft-psd --features serde
        cargo clippy --locked -p craft-psd --all-targets --features serde -- -D warnings
