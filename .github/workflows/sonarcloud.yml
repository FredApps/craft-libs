name: BMP affected-crate exploratory diagnostic (not a gate)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bmp-affected-crate-exploratory-7fea38b2
  cancel-in-progress: false
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v7.0.1
        with:
          repository: FredApps/craft-libs
          ref: 7fea38b2c5ab3e0fb3ddf85a4866ee369869ff7f
          persist-credentials: false
      - name: Install stable Rust
        uses: step-security/dtolnay-rust-toolchain@v1.0.0
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Verify source and disclose scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 7fea38b2c5ab3e0fb3ddf85a4866ee369869ff7f
          echo 'Exploratory package diagnostic. Cold runtime unknown; 20 minute hard cap. Not full workspace, Sonar or merge-gate certification.' >> "$GITHUB_STEP_SUMMARY"
          rustc --version
      - name: Package formatting
        run: cargo fmt --check -p craft-image-codecs
      - name: Unfiltered affected-crate tests and doctests
        run: cargo test --locked -p craft-image-codecs
      - name: Affected-crate all-target lint
        run: cargo clippy --locked -p craft-image-codecs --all-targets -- -D warnings
