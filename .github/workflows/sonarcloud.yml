name: PSD targeted diagnostic (not Sonar or workspace certification)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psd-targeted-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  default:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@7d4597abb21f0a8fa959395b0789e79fa19849ca
    with:
      os: '["ubuntu-24.04"]'
      craft-fonts-ref: ""
      require-craft-fonts: false
      targets: ""
      tools: ""
      free-disk-space: false
      timeout-minutes: 30
      gate-timeout-minutes: 25
      command: |
        set -euo pipefail
        cargo fmt -p craft-psd --check
        cargo test -p craft-psd --locked --all-targets
        cargo test -p craft-psd --locked --doc
        cargo build -p craft-psd --locked --examples
        cargo doc -p craft-psd --locked --no-deps
        cargo clippy -p craft-psd --locked --all-targets -- -D warnings
  all-features:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@7d4597abb21f0a8fa959395b0789e79fa19849ca
    with:
      os: '["ubuntu-24.04"]'
      craft-fonts-ref: ""
      require-craft-fonts: false
      targets: ""
      tools: ""
      free-disk-space: false
      timeout-minutes: 30
      gate-timeout-minutes: 25
      setup-command: timeout 6m python3 scripts/psd-diagnostic/fetch.py
      command: |
        set -euo pipefail
        cargo test -p craft-psd --locked --all-targets --all-features
        cargo test -p craft-psd --locked --doc --all-features
        cargo build -p craft-psd --locked --examples --all-features
        cargo doc -p craft-psd --locked --no-deps --all-features
        cargo clippy -p craft-psd --locked --all-targets --all-features -- -D warnings
