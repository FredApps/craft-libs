name: MXF lossless partition diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mxf-partitions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@7d4597abb21f0a8fa959395b0789e79fa19849ca
    with:
      os: '["windows-latest", "ubuntu-latest"]'
      select-os: '[]'
      timeout-minutes: 25
      tools: cargo-nextest@0.9.150
      env: |
        CARGO_PROFILE_DEV_DEBUG=0
      lint-command: |
        cargo fmt --package craft-media --check
        cargo clippy --locked --package craft-media --all-features --all-targets -- -D warnings
      command: |
        unset CRAFT_HOSTILE_DIVISOR PROPTEST_CASES CRAFT_MEDIA_HOSTILE_MULT
        cargo nextest run --locked --package craft-media --all-features --lib --profile ci -E 'test(/^mxf::/)'
