      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@41d7adf6c0ff7f98b2d12290fd6dc4a5d9111440
      - uses: step-security/taiki-e-install-action@v2.87.32
        with:
          tool: cargo-nextest@0.9.150
      - name: Install matching Rust runtime
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/download-artifact@v8.0.2
        with:
          name: archive-${{ github.run_id }}-${{ github.run_attempt }}-default-integration-windows-latest
          path: pilot-bundle
      - name: Verify and execute archive shard
        shell: bash
        env:
          CONFIG: default
          TARGET_KIND: integration
          SHARD: ${{ matrix.shard }}
        run: bash scripts/ci-windows-archive-consumer.sh "$CONFIG" "$SHARD" "$TARGET_KIND"
      - name: Upload successful inventory proof
        uses: actions/upload-artifact@v7.0.2
        with:
          name: proof-default-integration-${{ matrix.shard }}
          path: pilot-proof
          if-no-files-found: error
          retention-days: 1
  archive_all_features_unit:
    name: Archive all-features unit
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@7d4597abb21f0a8fa959395b0789e79fa19849ca
