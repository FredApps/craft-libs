      select-os: '[]'
      timeout-minutes: 25
      tools: cargo-nextest@0.9.150
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      windows-env: |
        CARGO_PROFILE_DEV_DEBUG=0
        CRAFT_PRINT_REQUIRE_QUEUE=1
      setup-command: bash scripts/ci-test-inputs.sh
      command: bash scripts/ci-windows-integrated-producer.sh all-features unit
      artifact-name: archive-${{ github.run_id }}-${{ github.run_attempt }}-all-features-unit
      artifact-path: pilot-bundle
  execute_all_features_unit:
    needs: archive_all_features_unit
    name: Run all-features unit ${{ matrix.shard }}/8
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      CRAFT_PRINT_REQUIRE_QUEUE: 1
      CRAFT_FONTS_REQUIRED: 1
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
