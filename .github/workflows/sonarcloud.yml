# Inactive read-only measurement source, never an application gate.
name: Existing Windows artifact hash cost
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Validate exact existing artifact and source resource pin
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = gh api repos/FredApps/craft-libs/actions/artifacts/14496542319
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read artifact metadata' }
          $artifact = $raw | ConvertFrom-Json
          if ($artifact.id -ne 14496542319 -or $artifact.name -ne 'archive-44451212129-1-all-features-integration-windows-latest' -or $artifact.expired -or $artifact.size_in_bytes -ne 666942881 -or $artifact.workflow_run.id -ne 44451212129 -or $artifact.workflow_run.head_sha -ne '2f3345d60d0696680a09028805f0a7b2a483e54b') { throw 'Artifact identity changed or expired' }
          # This exact historical source predates the optional i18n pin.
          $treeRaw = gh api 'repos/FredApps/craft-libs/git/trees/2f3345d60d0696680a09028805f0a7b2a483e54b?recursive=1' --jq '{truncated, pins: [.tree[] | select(.path == "craft-i18n.rev")]}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify source tree' }
          $tree = $treeRaw | ConvertFrom-Json
          if ($tree.truncated -or @($tree.pins).Count -ne 0) { throw 'Expected complete tree with absent i18n pin' }
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: '14496542319'
          repository: FredApps/craft-libs
          run-id: '44451212129'
          github-token: ${{ github.token }}
          path: existing-artifact
          digest-mismatch: error
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      - name: Pure extraction safety regressions, no application execution
        shell: pwsh
        run: python scripts/test-ci-windows-hash-cost.py
      - name: Measure hashes without executing archived binaries
        shell: pwsh
        run: python scripts/ci-windows-hash-cost.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: read-only-hash-cost-${{ github.run_id }}
          path: hash-cost-report.json
          if-no-files-found: error
          retention-days: 1
