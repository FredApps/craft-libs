name: Full gate harness only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-harness-pilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  harness:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      os: '["ubuntu-latest","windows-latest","macos-latest"]'
      select-os: '[]'
      timeout-minutes: 10
      tools: ""
      craft-fonts-ref: ""
      require-craft-fonts: false
      command: python scripts/test-full-validation.py
