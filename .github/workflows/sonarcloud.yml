    needs: [archive_default_unit, execute_default_unit, archive_default_integration, execute_default_integration, archive_all_features_unit, execute_all_features_unit, archive_all_features_integration, execute_all_features_integration]
    if: ${{ success() && needs.archive_default_unit.result == 'success' && needs.execute_default_unit.result == 'success' && needs.archive_default_integration.result == 'success' && needs.execute_default_integration.result == 'success' && needs.archive_all_features_unit.result == 'success' && needs.execute_all_features_unit.result == 'success' && needs.archive_all_features_integration.result == 'success' && needs.execute_all_features_integration.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # No run-id override: download-artifact is restricted to this workflow run.
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: proof-*
          path: proofs
      - run: python scripts/ci-windows-integrated-audit.py reconcile
