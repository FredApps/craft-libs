name: SVG path-format scoped validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: svg-path-format-${{ github.ref }}
  cancel-in-progress: false
jobs:
  svg:
    if: github.repository == 'FredApps/craft-libs' && github.ref == 'refs/heads/diag/svg-path-format-8b1f6c0d'
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@ecb64b2acb8731f0e2eb8f55fd2f45424bef75d0
    with:
      os: '["ubuntu-24.04", "windows-latest"]'
      select-os: '[]'
      timeout-minutes: 20
      gate-timeout-minutes: 18
      tools: ''
      targets: ''
      craft-fonts-ref: ''
      require-craft-fonts: false
      cache-name: svg-path-format-scoped
      command: |
        git fetch --no-tags origin 8b1f6c0d339ce12340d14a42a1b04955c1337368
        git diff --exit-code 8b1f6c0d339ce12340d14a42a1b04955c1337368 HEAD -- . ':(exclude).github/workflows/sonarcloud.yml'
        echo 'Scoped craft-svg no-default/all-feature tests and lint only. Not full workspace or consumer certification.'
        cargo fmt -p craft-svg -- --check
        cargo test --locked -p craft-svg --no-default-features
        cargo test --locked -p craft-svg --all-features
        cargo clippy --locked -p craft-svg --all-targets --all-features -- -D warnings
