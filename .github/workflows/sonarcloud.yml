name: RTF control-word scoped diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rtf:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@v1.0.0
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check exact candidate source and unchanged lockfile
        shell: bash
        run: |
          git diff --exit-code a4b3e0901a76e9911f7b5683d66263ef31b7c059 HEAD -- crates Cargo.toml Cargo.lock
      - name: Format
        run: cargo fmt --package craft-rtf --check
      - name: RTF default and Outlook tests
        run: cargo test -p craft-rtf --features outlook --locked
      - name: RTF default and Outlook lint
        run: cargo clippy -p craft-rtf --all-targets --features outlook --locked -- -D warnings
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- Cargo.lock
