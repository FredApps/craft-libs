  execute_all_features_integration:
    needs: archive_all_features_integration
    name: Run all-features integration ${{ matrix.shard }}/8
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      CRAFT_PRINT_REQUIRE_QUEUE: 1
      CRAFT_FONTS_REQUIRED: 1
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
